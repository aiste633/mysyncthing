org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Pinned NDK, read by :app, :core, go/build.sh and CI. Also pinned in fdroid/eu.stedb.mysyncthing.yml.
mysyncthing.ndkVersion=30.0.16248370
# Downloads: Maven Central answers 429 Too Many Requests to busy shared CI runners. Gradle retries
# only 429, 408 and server errors; these give 4 tries 10, 20 and 40 s apart instead of 3 tries
# 1 and 2 s apart. The first pair covers a repository's metadata (POMs, plugin markers: after its
# last try Gradle stops asking that repository for the rest of the build), the second the files.
systemProp.org.gradle.internal.repository.max.tentatives=4
systemProp.org.gradle.internal.repository.initial.backoff=10000
systemProp.org.gradle.internal.network.retry.max.attempts=4
systemProp.org.gradle.internal.network.retry.initial.backOff=10000
