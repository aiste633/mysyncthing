name: codeql

# CodeQL static analysis with a real build, so it sees the Kotlin app and the whole Go core
# with our patches; GitHub's default setup can build neither. Runs on main, weekly and by hand,
# and on pull requests only when they change this file (a full build per language; the build
# workflow covers PRs).
# Needs Settings > Code security > CodeQL analysis set to "Advanced": GitHub refuses uploads
# from a workflow while its default setup is on.
on:
  push:
    branches: [main]
  pull_request:
    paths: [.github/workflows/codeql.yml]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: go
            build-mode: manual
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ matrix.build-mode == 'manual' }}
      - if: matrix.build-mode == 'manual'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/bridge/go.mod
          cache: false
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - if: matrix.language == 'java-kotlin'
        name: Android SDK platform and NDK
        run: |
          ndk="$(sed -n 's/^mysyncthing\.ndkVersion=//p' gradle.properties)"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;$ndk" > /dev/null
      - if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
          cache-provider: basic
      # The core as the app builds it: our patches applied, web GUI assets generated.
      - if: matrix.build-mode == 'manual'
        name: Patch the core
        run: |
          go/patch.sh
          (cd go/syncthing && go generate ./lib/api/auto)
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.language == 'go'
        name: Build the Go bridge and the core it links
        working-directory: go/bridge
        run: go build ./...
      - if: matrix.language == 'java-kotlin'
        name: Build the app
        run: ./gradlew --no-daemon --no-build-cache :app:assembleDebug
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
