name: build

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/syncthing/go.mod
          cache-dependency-path: go/bridge/go.sum
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate web GUI assets
        working-directory: go/syncthing
        run: go generate ./lib/api/auto
      - name: Go bridge tests
        working-directory: go/bridge
        run: go vet . && go test .
      - name: Build, unit tests, lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
