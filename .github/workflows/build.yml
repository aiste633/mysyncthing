name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/syncthing/go.mod
          cache-dependency-path: go/bridge/go.sum
      # The runner image ships the SDK and cmdline-tools; the NDK is pinned in gradle.properties.
      - name: Android SDK platform and NDK
        run: |
          ndk="$(sed -n 's/^mysyncthing\.ndkVersion=//p' gradle.properties)"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "ndk;$ndk" > /dev/null
      - uses: gradle/actions/setup-gradle@v5
      - name: Generate web GUI assets
        working-directory: go/syncthing
        run: go generate ./lib/api/auto
      - name: Go bridge tests
        working-directory: go/bridge
        run: go vet . && go test .
      - name: Build, unit tests, lint
        # :core is never bundled as an AAR (it embeds the local Go AAR), so build via :app.
        run: ./gradlew --no-daemon :app:assembleDebug testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: No personal details in files, commits or history
        run: scripts/check-leaks.sh
