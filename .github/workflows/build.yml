name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go/bridge/go.mod
          cache-dependency-path: go/bridge/go.sum
      # The runner image ships the SDK and cmdline-tools; the NDK is pinned in gradle.properties.
      - name: Android SDK platform and NDK
        run: |
          ndk="$(sed -n 's/^mysyncthing\.ndkVersion=//p' gradle.properties)"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;$ndk" > /dev/null
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Patch the core
        run: go/patch.sh
      - name: Generate web GUI assets
        working-directory: go/syncthing
        run: go generate ./lib/api/auto
      - name: Patched core package tests
        working-directory: go/syncthing
        run: go test ./lib/api
      - name: Go bridge tests
        working-directory: go/bridge
        run: go vet . && go test .
      - name: Build, unit tests, screen tests, lint
        # :core is never bundled as an AAR (it embeds the local Go AAR), so build via :app.
        # verifyRoborazziDebug runs the unit tests with the screenshots compared to app/src/test/screenshots.
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest testDebugUnitTest :app:verifyRoborazziDebug :app:lintDebug :app:processReleaseManifest
      # A desktop Syncthing from the same patched core, for the e2e job to sync with.
      - name: Test peer for the emulator tests
        working-directory: go/syncthing
        run: go build -trimpath -tags noupgrade -ldflags "-X github.com/syncthing/syncthing/lib/build.Version=$(cat ../syncthing.version)" -o ../build/e2e-peer ./cmd/syncthing
      - name: Permissions and exported components as committed
        run: scripts/manifest-surface.py --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-inputs
          retention-days: 3
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            go/build/e2e-peer
      - name: Screenshots that differ, with their diff images
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-diffs
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore

  # The app on emulators (Android 15 and 16) against a real Syncthing peer: pairing, accepting a
  # folder, sync both ways, restoring a version, run conditions, typed text kept, process death,
  # All files access taken away, and a monkey run (scripts/e2e/run.py).
  e2e:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-inputs
      # The emulator links PulseAudio even with -no-audio; the runner image does not have it.
      - name: Emulator system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libpulse0
      - name: Emulator
        timeout-minutes: 15
        env:
          API: ${{ matrix.api }}
          E2E_EMULATOR_LOG: build/e2e/emulator.log
          E2E_SDK_UPDATE: "1"
        run: mkdir -p build/e2e && scripts/e2e/emulator.sh "$API"
      - name: End-to-end tests
        timeout-minutes: 25
        run: |
          chmod +x go/build/e2e-peer
          scripts/e2e/run.py --peer go/build/e2e-peer --apk app/build/outputs/apk/debug/app-debug.apk \
            --test-apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk --out build/e2e
      - name: Logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-api${{ matrix.api }}
          path: build/e2e/
          if-no-files-found: ignore

  # The committed SBOM (docs/sbom.*) must match what the dependencies are now. Its own job:
  # read-only, no secrets, and the SBOM tools never run in the build that makes the APK.
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go/bridge/go.mod
          cache-dependency-path: |
            go/bridge/go.sum
            scripts/sbom/go.sum
      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: SBOM matches the dependencies
        run: scripts/sbom.sh --check

  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: No personal details in files, commits or history
        run: scripts/check-leaks.sh

  strings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Text for people only in strings.xml
        run: scripts/check-strings.py

  # Static analysis of these workflows: injection, credentials left in the checkout, permissions,
  # and (with the token) that every pinned action commit really belongs to that action.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --no-deps --require-hashes -r scripts/zizmor-requirements.txt
          "$RUNNER_TEMP/zizmor/bin/zizmor" --format github .github/workflows
