# Draft of metadata/eu.stedb.mysyncthing.yml for https://gitlab.com/fdroid/fdroiddata.
# Not submitted yet. For a new release, update the Builds entry to the release tag.
# CI builds from this file too (.github/workflows/reproducible.yml), with Repo and commit
# pointed at the commit under test, so keep the build steps here and in CI in one place.
# Go is built from source: srclibs go, checked out at the release named by the toolchain
# line of go/bridge/go.mod, replaces the prebuilt one go/build.sh would fetch. Debian's
# golang-go (forky: Go 1.26 needs 1.24.6 or newer to build) only bootstraps it. Go builds
# itself reproducibly, so the APK is byte-identical either way.
Categories:
  - Cloud Storage & File Sync
  - Connectivity
License: AGPL-3.0-only
SourceCode: https://github.com/aiste633/mysyncthing
IssueTracker: https://github.com/aiste633/mysyncthing/issues
Changelog: https://github.com/aiste633/mysyncthing/releases

AutoName: MySyncthing

RepoType: git
Repo: https://github.com/aiste633/mysyncthing.git
Binaries: https://github.com/aiste633/mysyncthing/releases/download/v%v/mysyncthing-%v.apk

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: v0.1.0
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless
      - update-alternatives --set java /usr/lib/jvm/java-21-openjdk-amd64/bin/java
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky golang-go
    gradle:
      - yes
    srclibs:
      - go@go1.26.10
    prebuild:
      - git -C $$go$$ checkout -f "$(sed -n 's/^toolchain //p' ../go/bridge/go.mod)"
      - sed -i -e 's|^export GOTOOLCHAIN=.*|export PATH="$$go$$/bin:$PATH" GOTOOLCHAIN=local|'
        ../go/build.sh
    scandelete:
      - go/syncthing/lib/model/testdata
      - go/bridge/testdata/fork
    build:
      - pushd $$go$$/src
      - ./make.bash
      - popd
    ndk: 30.0.16248370

AllowedAPKSigningKeys: 71c8e04b73a0242d201948e8df9fe44d50c360d141f70701b9bd60b39b0fd668

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 0.1.0
CurrentVersionCode: 1
