# Draft of metadata/eu.stedb.mysyncthing.yml for https://gitlab.com/fdroid/fdroiddata.
# Not submitted yet. Before submitting: fill in AllowedAPKSigningKeys (scripts/sign-release.sh
# prints it) and update the Builds entry to the release tag.
# CI builds from this file too (.github/workflows/reproducible.yml), with Repo and commit
# pointed at the commit under test, so keep the build steps here and in CI in one place.
# go/build.sh fetches the Go named by the toolchain line of go/bridge/go.mod (GOTOOLCHAIN,
# checksum-verified), now go1.26.10. Reviewers may ask for a source-built Go instead (srclibs: go@go1.26.10, as
# Syncthing-Fork's recipe does).
Categories:
  - Cloud Storage & File Sync
  - Connectivity
License: AGPL-3.0-only
SourceCode: https://github.com/aiste633/mysyncthing
IssueTracker: https://github.com/aiste633/mysyncthing/issues
Changelog: https://github.com/aiste633/mysyncthing/releases

AutoName: MySyncthing

RepoType: git
Repo: https://github.com/aiste633/mysyncthing.git
Binaries: https://github.com/aiste633/mysyncthing/releases/download/v%v/mysyncthing-%v.apk

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: v0.1.0
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless golang-go
      - update-alternatives --set java /usr/lib/jvm/java-21-openjdk-amd64/bin/java
    gradle:
      - yes
    scandelete:
      - go/syncthing/lib/model/testdata
      - go/bridge/testdata/fork
    ndk: 30.0.16248370

# Fill in before submitting: the SHA-256 that scripts/sign-release.sh prints.
# AllowedAPKSigningKeys: <64 hex digits>

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 0.1.0
CurrentVersionCode: 1
